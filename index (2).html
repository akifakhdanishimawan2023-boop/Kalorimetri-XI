const R=a=>a[Math.floor(Math.random()*a.length)],sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);

const set=h=>{V.innerHTML=h;scrollTo(0,0);document.body.classList.remove('bgm')};

/* AUDIO */
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();mg.gain.value=.5;mg.connect(AC.destination);mus=AC.createGain();mus.gain.value=.25;mus.connect(mg)}AC.state=='suspended'&&AC.resume()}
function tn(f,d,t,v,o){const a=AC.createOscillator(),g=AC.createGain();a.type=t;a.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);a.connect(g);g.connect(o||mg);a.start();a.stop(AC.currentTime+d)}
const sfx=k=>{if(!AC)return;k=='ok'?(tn(660,.12,'sine',.3),setTimeout(()=>tn(880,.18,'sine',.3),110)):k=='no'?tn(180,.3,'sawtooth',.15):tn(520,.07,'square',.12)};
const NT=[523,659,784,659,880,784,659,587,523,659,784,1047,880,784,659,587];
setInterval(()=>{if(AC&&$('#mon').checked)tn(NT[mi++%NT.length],.28,'triangle',.5,mus)},320);
$('#vol').oninput=e=>{ac();mg.gain.value=e.target.value/100};
document.addEventListener('click',e=>{if(e.target.closest('button'))sfx('c')});
$('#nm').onkeydown=e=>{if(e.key=='Enter')$('#kl').focus()};$('#kl').onkeydown=e=>{if(e.key=='Enter')start()};
function start(){name=$('#nm').value.trim();kelas=$('#kl').value.trim();if(name.length<2){$('#er').textContent='Tulis namamu dulu ya (minimal 2 huruf).';return}if(kelas.length<1){$('#er').textContent='Tulis kelasmu dulu ya (contoh: XI IPA 1).';return}ac();$('#splash').classList.add('hidden');$('#app').classList.remove('hidden');menu()}

function menu(){set(`<div class="text-center pop"><div class="inline-block bg-white/85 rounded-2xl px-5 py-3 mb-6"><h2 class="text-3xl font-black text-blue-800">Halo, ${esc(name)}!</h2><p class="font-bold">Kelas ${esc(kelas)}</p><p>Pilih menu untuk mulai belajar kalorimetri.</p></div><div class="grid grid-cols-2 gap-4">${[['BERANDA','🏠','beranda'],['MATERI','📘','materi'],['SIMULASI','🧪','simulasi'],['KUIS','🎮','kuis']].map(x=>`<button class="btn ${x[0]=='BERANDA'?'btnu ':x[0]=='MATERI'?'btnp ':x[0]=='KUIS'?'btnk ':''}text-xl py-8" onclick="${x[2]}()">${x[1]}<br>${x[0]}</button>`).join('')}</div><p class="mt-8 text-sm text-blue-900"><span class="bg-white/85 rounded-full px-3 py-1">Pengembang: ${DEV} • ${YR}</span></p></div>`);document.body.classList.add('bgm')}
function beranda(){set(`<div class="card"><h2 class="text-2xl font-black text-purple-800">🏠 Beranda</h2><img src="${BIMG}" alt="Siswa melakukan percobaan kalorimetri di laboratorium" class="w-full max-w-md mx-auto rounded-xl my-3 shadow"><p><b>Kimia • Kelas XI • Topik: Kalorimetri</b></p><p>Proyek kita: <i>Dapur Hemat Energi Desa Kita</i>. Bahan bakar apa di desa kita yang menghasilkan kalor paling besar per gram?</p><h3 class="font-black mt-3">Tujuan pembelajaran</h3><ul class="list-disc ml-5"><li>Menjelaskan kalor, sistem, lingkungan, eksoterm, dan endoterm.</li><li>Menghitung q = m·c·ΔT dan ΔH per mol dari data kalorimeter.</li><li>Membaca data suhu dan menafsirkan hasilnya.</li><li>Membandingkan kalor bahan bakar lokal dan menilai sumber galat.</li><li>Merekomendasikan bahan bakar hemat energi berdasarkan data.</li></ul><h3 class="font-black mt-3">Cara belajar</h3><p>Baca <b>Materi</b> dan coba <b>Lab Virtual</b>, uji diri di <b>Kuis</b>, lalu selesaikan <b>Simulasi</b> 10 soal untuk mendapat sertifikat.</p><p class="text-sm mt-3">Pengembang: ${DEV} • ${YR}</p></div>`)}
/* MATERI */
const M=[['Kalor','<h3 class="font-black text-lg text-blue-800">Apa itu kalor?</h3><p>Kalor (<b>q</b>) adalah energi yang berpindah karena perbedaan suhu, satuannya joule (J). <b>Sistem</b> adalah zat atau reaksi yang diamati; <b>lingkungan</b> adalah sekitarnya (larutan, wadah, udara). <b>Kalorimetri</b> adalah cara mengukur kalor reaksi.</p><p class="hid">🍲 Di dapur desa, air di panci menyerap kalor dari api briket. Api adalah sumber kalor, air adalah penerimanya.</p><p class="hid">🏃 Energi singkong atau pisang untuk atlet diukur dengan prinsip yang sama: kalor yang dilepas saat dibakar.</p>'],
['Eksoterm &amp; endoterm','<div class="grid sm:grid-cols-2 gap-3"><div class="rounded-xl bg-blue-100 p-3"><b>Eksoterm</b><br>Sistem melepas kalor, suhu lingkungan naik, ΔH &lt; 0.</div><div class="rounded-xl bg-blue-100 p-3"><b>Endoterm</b><br>Sistem menyerap kalor, suhu lingkungan turun, ΔH &gt; 0.</div></div><p class="hid">Contoh eksoterm: pembakaran briket, NaOH larut dalam air, netralisasi HCl + NaOH.</p><p class="hid">Contoh endoterm: NH₄Cl larut dalam air, es mencair, fotosintesis.</p>'],
['Rumus kalor','<p class="text-2xl font-black text-center my-3">q = m × c × ΔT</p><p>m = massa (g), c = kalor jenis air 4,18 J/g·°C, ΔT = T akhir − T awal.</p><p class="hid"><b>Contoh:</b> 250 g air naik dari 26 °C ke 36 °C.</p><p class="hid">ΔT = 36 − 26 = 10 °C</p><p class="hid">q = 250 × 4,18 × 10 = 10.450 J = 10,45 kJ</p><p class="hid">Awas: pakai ΔT, bukan suhu akhir, dan cek satuan J atau kJ.</p>'],
